<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Aoo - Feature Request</title>
<meta name="description" content="Have a feature idea? Help us tailor Aoo to your team's financial operations.">
<link rel="icon" type="image/png" href="assets/aoo-logo.png">
<!-- Fonts: Open Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0c0d10',
              card: 'rgba(23, 24, 29, 0.65)',
              purple: '#5e3bee',
              purpleHover: '#502fe0',
              accent: '#ff5ea7',
              amber: '#fca311',
              emerald: '#10b981'
            }
          },
          fontFamily: {
            sans: ['"Open Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-glass-effects">
    /* Subtle dot grid overlay mimicking credit card preview pattern */
    .bg-dot-matrix {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* Frosted glass container styling */
    .glass-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(18, 19, 24, 0.6);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Custom input focus states */
    .form-input-dark {
      background-color: rgba(26, 27, 33, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
      transition: all 0.2s ease-in-out;
    }
    .form-input-dark:focus {
      background-color: rgba(30, 32, 40, 0.95);
      border-color: rgba(94, 59, 238, 0.9);
      box-shadow: 0 0 0 3px rgba(94, 59, 238, 0.25);
      outline: none;
    }
    /* Kill Tailwind forms-plugin native select arrow (we use our own SVG) */
    select.form-input-dark {
      background-image: none !important;
      -webkit-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-[#0c0d10] text-gray-200 font-sans min-h-screen relative overflow-x-hidden selection:bg-[#5e3bee] selection:text-white flex flex-col justify-between">
<!-- BEGIN: AmbientBackgroundGradients -->
<!-- Blurred luminous spheres matching Aoo Launching Soon visual design -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<!-- Top-center pink orb -->
<div class="absolute top-[8%] left-[43%] w-[240px] h-[240px] rounded-full bg-[#f43f85] opacity-60 blur-[90px]"></div>
<!-- Purple orb behind the center right -->
<div class="absolute top-[14%] left-[50%] w-[420px] h-[420px] rounded-full bg-[#5925dc] opacity-55 blur-[120px]"></div>
<!-- Amber/Golden orb on left flank -->
<div class="absolute top-[28%] left-[28%] w-[280px] h-[280px] rounded-full bg-[#f59e0b] opacity-50 blur-[100px]"></div>
</div>
<!-- END: AmbientBackgroundGradients -->
<!-- BEGIN: TopNavigation -->
<header class="relative z-10 w-full max-w-7xl mx-auto px-6 sm:px-10 py-7 flex items-center justify-between">
<!-- Back -->
<div class="flex items-center gap-6">
<!-- Back to Waitlist Action -->
<a class="inline-flex items-center gap-2 text-xs font-medium text-gray-400 hover:text-white transition-colors py-1.5 px-3 rounded-full hover:bg-white/5 border border-transparent hover:border-white/10" href="index.html">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="">Back to Waitlist</span>
</a>
</div>
<!-- Private Beta Status Pill -->
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-white/10 bg-white/5 text-xs text-gray-300 font-medium backdrop-blur-md">
<span class="w-2 h-2 rounded-full bg-[#f59e0b] animate-pulse"></span>
<span class="">Private Beta Access</span>
</div>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: MainContent -->
<main class="relative z-10 flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
<div class="w-full max-w-xl">
<!-- Card Container -->
<div class="glass-panel bg-dot-matrix rounded-3xl p-6 sm:p-10 relative shadow-2xl">
<!-- Header Section Inside Card -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-white/5 border border-white/10 mb-4 text-[#8b5cf6]">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Feature Request</h1>
<p class="mt-2.5 text-sm text-gray-400 max-w-md mx-auto leading-relaxed">
            Have a feature idea or product suggestion? Help us meaningful features to our Aoo with your request.
          </p>
</div>

<!-- Tally embed — single submit, no redirect. Responses land in tally.so dashboard. -->

<!-- Form (Tally inline embed) -->
<div class="rounded-xl overflow-hidden">
<iframe data-tally-src="https://tally.so/embed/dWM1ro?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0" title="Aoo feature request"></iframe>
</div>

</div>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: PageFooter -->
<footer class="relative z-10 w-full py-6 text-center text-xs text-gray-500">
<div class="flex items-center justify-center gap-6">
<span class="">&copy; 2026 Aoo Labs Inc.</span>
<a class="hover:text-gray-400 transition-colors" href="#">Privacy</a>
<a class="hover:text-gray-400 transition-colors" href="#">Terms</a>
</div>
</footer>
<!-- END: PageFooter -->
<script src="https://tally.so/widgets/embed.js"></script>
</body>
</html>
